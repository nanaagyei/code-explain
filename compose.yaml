# Run from repo root (no -f needed): docker compose up -d
# Requires OPENAI_API_KEY (shell or .env next to this file for Compose interpolation).
# Postgres host port: 5433 | API: http://localhost:8000 | pgAdmin: http://localhost:5050

name: codexplain

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: codeexplain
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: codeexplain_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeexplain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@codeexplain.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://codeexplain:devpassword123@postgres:5432/codeexplain_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DEBUG: "True"
      ENV: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your environment or in a .env file in the repo root}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
